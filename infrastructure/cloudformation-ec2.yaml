      GenerateSecretString:
        SecretStringTemplate: '{"username": "intersectia"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'

  TokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/intersectia/internal-token'
      Description: Token interno backend <-> IA
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: token
        PasswordLength: 48
'

  # ===================== RDS =====================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets privadas para RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    # Delete (no Snapshot): al borrar el stack no queda snapshot final.
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-intersectia-db'
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      DBName: intersectia
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 1
      MultiAZ: false
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-intersectia-database'

  # ===================== IAM (Secrets + Logs + SSM + Bedrock) =====================
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref TokenSecret
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}'
                  - !Sub 'arn:aws:bedrock:*::foundation-model/meta.llama3-1-8b-instruct-v1:0'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # ===================== EC2 =====================
  ElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-intersectia-eip'

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: Database
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-intersectia'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log) 2>&1
          echo "=== IntersectIA setup ==="

          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          dnf update -y
          dnf install -y docker git jq
          systemctl enable --now docker
          usermod -aG docker ec2-user

          COMPOSE_VERSION="v2.27.0"
          curl -L "https://github.com/docker/compose/releases/download/${!COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          (cd /tmp && unzip -q awscliv2.zip && ./aws/install && rm -rf aws awscliv2.zip)

          REGION=${AWS::Region}
          APP_DIR=/home/ec2-user/intersectia
          mkdir -p $APP_DIR && cd $APP_DIR

          for r in intersectia-backend intersectia-frontend intersectia-ai; do
            [ -d "$r" ] || git clone --branch ${GitBranch} https://github.com/ThonkasM/$r.git
          done

          DB_PASS=$(aws secretsmanager get-secret-value --secret-id ${DbSecret} --region $REGION --query SecretString --output text | jq -r .password)
          TOKEN=$(aws secretsmanager get-secret-value --secret-id ${TokenSecret} --region $REGION --query SecretString --output text | jq -r .token)
          DB_PASS_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$DB_PASS")

          cat > .env <<ENVFILE
          DATABASE_URL=postgresql://intersectia:${!DB_PASS_ENC}@${Database.Endpoint.Address}:5432/intersectia?schema=public
          INTERNAL_SERVICE_TOKEN=${!TOKEN}
          AI_INTERNAL_SERVICE_TOKEN=${!TOKEN}
          AI_AWS_REGION=${AWS::Region}
          AI_BEDROCK_MODEL_ID=${BedrockModelId}
          CORS_ORIGIN=${AllowedCORSOrigin}
          ENVFILE
          chmod 600 .env; chown ec2-user:ec2-user .env

          cat > docker-compose.yml <<'EOF'
          services:
            ai:
              build: ./intersectia-ai
              restart: unless-stopped
              env_file: .env
              logging:
                driver: awslogs
                options:
                  awslogs-region: ${AWS::Region}
                  awslogs-group: /ec2/intersectia
                  awslogs-create-group: "true"
            backend:
              build: ./intersectia-backend
              restart: unless-stopped
              env_file: .env
              environment:
                PORT: "3000"
                AI_SERVICE_URL: http://ai:8000
              command: sh -c "npx prisma migrate deploy && node dist/main"
              depends_on: [ai]
              logging:
                driver: awslogs
                options:
                  awslogs-region: ${AWS::Region}
                  awslogs-group: /ec2/intersectia
                  awslogs-create-group: "true"
            frontend:
              build: ./intersectia-frontend
              restart: unless-stopped
              depends_on: [backend]
              ports: ["80:80"]
              logging:
                driver: awslogs
                options:
                  awslogs-region: ${AWS::Region}
                  awslogs-group: /ec2/intersectia
                  awslogs-create-group: "true"
          EOF

          su ec2-user -c "cd $APP_DIR && docker-compose up -d --build"

          echo "=== Listo: http://CloudFrontURL/ ==="

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      EIP: !Ref ElasticIP

  # ===================== CloudFront (HTTPS sin dominio) =====================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateCloudFront
    DependsOn: EIPAssociation
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${EnvironmentName} IntersectIA'
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: EC2Origin
            DomainName: !GetAtt EC2Instance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: EC2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: true
            Headers:
              - Authorization
              - Accept
              - Content-Type
              - Origin
            Cookies:
              Forward: all
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
          Compress: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  AppURL:
    Description: URL publica de la app (CloudFront si esta habilitado; si no, HTTP directo a la EC2)
    Value: !If [CreateCloudFront, !Sub 'https://${CloudFrontDistribution.DomainName}', !Sub 'http://${ElasticIP}']
  EC2PublicIP:
    Value: !Ref ElasticIP
  EC2InstanceId:
    Value: !Ref EC2Instance
  SSMSessionCommand:
    Value: !Sub 'aws ssm start-session --target ${EC2Instance} --region ${AWS::Region}'
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  CloudFrontURL:
    Condition: CreateCloudFront
    Description: URL HTTPS publica (CloudFront habilitado)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  UpdateCORSReminder:
    Condition: CreateCloudFront
    Description: Tras el primer deploy, poner AllowedCORSOrigin en el dominio de CloudFront y actualizar el stack.
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
