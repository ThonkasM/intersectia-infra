      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-sg'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IntersectIA RDS (5432 desde EC2)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
